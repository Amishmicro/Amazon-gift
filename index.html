
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise Gift</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1a4a4;
    font-family:Arial,sans-serif;
}

/* Flying Gifts */
.floating-gift{
    position:absolute;
    font-size:35px;
    opacity:0.8;
    animation:float linear infinite;
}

.floating-gift:nth-child(1){left:5%;animation-duration:4s;}
.floating-gift:nth-child(2){left:15%;animation-duration:5s;}
.floating-gift:nth-child(3){left:25%;animation-duration:4.5s;}
.floating-gift:nth-child(4){left:35%;animation-duration:3.8s;}
.floating-gift:nth-child(5){left:45%;animation-duration:5s;}
.floating-gift:nth-child(6){left:55%;animation-duration:4.2s;}
.floating-gift:nth-child(7){left:65%;animation-duration:5.2s;}
.floating-gift:nth-child(8){left:75%;animation-duration:4s;}
.floating-gift:nth-child(9){left:85%;animation-duration:4.8s;}
.floating-gift:nth-child(10){left:95%;animation-duration:3.5s;}

@keyframes float{
    from{
        top:110%;
        transform:rotate(0deg);
    }
    to{
        top:-10%;
        transform:rotate(720deg);
    }
}

.container{
    background:#f5f5f5;
    padding:40px;
    border-radius:25px;
    text-align:center;
    width:500px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    z-index:10;
}

.gift{
    font-size:100px;
    animation:bounce 1s infinite;
    filter:drop-shadow(0 0 20px gold);
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-20px);
    }
}

h1{
    color:#e91e63;
}

p{
    color:#555;
    margin-bottom:25px;
}

.gift-btn{
    display:inline-block;
    background:#e91e63;
    color:white;
    text-decoration:none;
    padding:15px 40px;
    border-radius:30px;
    font-size:20px;
    font-weight:bold;
    transition:0.3s;
}

.gift-btn:hover{
    background:#c2185b;
    transform:scale(1.1);
}

</style>
</head>
<body>

<!-- Flying Gifts -->
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>
<div class="floating-gift">🎁</div>


<div class="container">

    <div class="gift">🎁</div>

    <h1>A Surprise Gift For You</h1>

    <p>Click the button below to claim your surprise!</p>

    <!-- PASTE YOUR LINK HERE -->
    
	<a href="https://giftclick.org/?offer_id=3303&aff_id=177593" class="gift-btn" target="_blank">
    		Gift
	</a>


</div>

</body>
</html>
